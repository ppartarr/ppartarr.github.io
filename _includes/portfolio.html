</div>
<div class="container">

          <img class="activator" src="{{ "/assets/img/caseblocks.jpg" | prepend: site.baseurl }}">
        </div>
        <div class="card-action">
          <span class="card-title activator grey-text text-darken-4">{{site.project_one}}<i class="material-icons right">more_vert</i></span>
          <p><a class="light-blue-text" href="{{site.project_one_url}}">Company website</a></p>

          <span class="card-title grey-text text-darken-4"><i class="material-icons right">close</i></span>

      </div>
    </div>
    <div class="col s6 l6">
      <div class="card medium sticky-action">
        <div class="card-image waves-effect waves-block waves-light">
          <img class="activator" src="{{ "/assets/img/messenger.jpg" | prepend: site.baseurl }}">

        <div class="card-action">
          <span class="card-title activator grey-text text-darken-4">{{site.project_two}}<i class="material-icons right">more_vert</i></span>
          <p><a class="light-blue-text" href="{{site.project_two_url}}">Github</a></p>

          <span class="card-title grey-text text-darken-4"><i class="material-icons right">close</i></span>
          <p>{{site.project_two_description}}</p>
          <a class="waves-effect blue-grey darken-4 z-depth-4 waves-light btn" href="https://chrome.google.com/webstore/detail/dracula-theme-for-messeng/ijphgphffpboghbejdbjjoddacphjafh" target="_blank"><i class="material-icons right">web</i>View in Chrome Store</a>
